name: TestFlight public links

# Opens each iPhone app to anyone through a TestFlight public link: test
# information, a "Public" tester group, the newest build added and sent to
# Beta App Review, the link switched on. mobile/scripts/testflight_public.py
# has the steps; mobile/testflight.json has the words. Runs after every
# successful "iPhone apps to TestFlight" run, and by hand.
#
# Same secrets as that workflow (APPSTORE_KEY_ID, APPSTORE_ISSUER_ID,
# APPSTORE_KEY_P8). Nothing personal is in this repo: the feedback email and
# the reviewer's contact details are typed into App Store Connect by Erik,
# and the job says plainly when they are still missing.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [all, trip, hopscotch, flight, insidejoke]
        default: all
  workflow_run:
    workflows: ['iPhone apps to TestFlight']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: testflight-public
  cancel-in-progress: false

jobs:
  public:
    name: Public links
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Up to 40 minutes waiting for Apple to process a fresh build, then the
    # API calls for four apps.
    timeout-minutes: 60
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: App Store Connect key
        env:
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          umask 077
          if printf '%s' "$APPSTORE_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPSTORE_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          else
            printf '%s' "$APPSTORE_KEY_P8" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/AuthKey.p8" || true
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error title=APPSTORE_KEY_P8::It is not a .p8 key. See mobile/README.md."
            exit 1
          fi

      - name: Public links
        working-directory: mobile
        env:
          APP: ${{ inputs.app || 'all' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" scripts/testflight_public.py "$APP"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
