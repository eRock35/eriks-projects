name: CI

# There was no CI here until 2026-09-21: every check was a person running
# things by hand, which meant a broken push stayed broken until someone
# noticed. These are the same suites that gate a deploy locally.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Syntax-check every server file
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './public/*' \
            -maxdepth 3 -print0 | xargs -0 -n1 node --check

      - name: Shared files have not drifted
        run: node scripts/sync-shared.js --check

      # test/owner.js boots Trip Planner and Football beside the apps here, to
      # check one session opens all of them. Both repos are public. Checked out
      # after the syntax check so it does not walk their files.
      - name: Check out Trip Planner
        uses: actions/checkout@v4
        with:
          repository: eRock35/trip-planner
          path: siblings/trip-planner

      - name: Check out College Football
        uses: actions/checkout@v4
        with:
          repository: eRock35/college-football-app
          path: siblings/college-football-app

      - name: Install the sibling apps
        run: |
          (cd siblings/trip-planner && npm ci)
          (cd siblings/college-football-app && npm ci)

      - name: Suites
        run: npm test
        env:
          SIBLING_REPOS: ${{ github.workspace }}/siblings
