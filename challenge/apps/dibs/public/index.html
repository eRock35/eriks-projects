<body class="dk">
  <a class="skip" href="#main">Skip to the bill</a>
  <header class="top">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">🙋</span>Dibs</a>
    <nav class="top-links" aria-label="Account">
      <button class="btn small ghost" id="tablesBtn" type="button" hidden>My tables</button>
      <button class="btn small ghost" id="acct" type="button">Sign in</button>
    </nav>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <!-- The example's one-liner, a phone-only bill's note, or the table bar. -->
    <section id="strip" aria-label="About this bill"></section>

    <!-- Start: snap or type (drawn when a fresh bill is begun). -->
    <section class="card flow" id="flow" hidden></section>

    <div class="layout" id="billView">
      <div class="col-main">
        <section class="card head" id="billHead" aria-label="The bill"></section>

        <section class="card" id="peopleCard" aria-labelledby="peopleH">
          <div class="sec-head">
            <h2 id="peopleH">Who’s calling dibs?</h2>
            <span class="small muted" id="peopleHint"></span>
          </div>
          <div class="people" id="people" role="group" aria-labelledby="peopleH"></div>
        </section>

        <section class="card" id="itemsCard" aria-labelledby="itemsH">
          <div class="sec-head">
            <h2 id="itemsH">What everyone had</h2>
            <button class="btn small ghost" id="editBtn" type="button" aria-pressed="false">Edit items</button>
          </div>
          <div id="unclaimed" aria-live="polite"></div>
          <ul class="items" id="items"></ul>
          <div class="row" id="itemTools" hidden>
            <button class="btn small ghost" id="addItem" type="button">+ Add an item</button>
            <button class="btn small ghost" id="pasteMore" type="button">Paste more lines</button>
          </div>
        </section>
      </div>

      <div class="col-side">
        <section class="card" id="extrasCard" aria-labelledby="extrasH">
          <div class="sec-head">
            <h2 id="extrasH">Tax, tip &amp; extras</h2>
          </div>
          <div id="extras"></div>
          <dl class="sums" id="sums"></dl>
          <div id="check" aria-live="polite"></div>
        </section>

        <section class="card settle" id="settleCard" aria-labelledby="settleH">
          <div class="sec-head">
            <h2 id="settleH">Who owes whom</h2>
          </div>
          <div id="celebrate" aria-live="polite"></div>
          <ul class="owes" id="owes"></ul>
          <p class="fair" id="fair"></p>
          <div id="handles"></div>
          <div class="summary" id="summaryBox"></div>
        </section>

        <section class="card share" id="shareCard" aria-labelledby="shareH"></section>
      </div>
    </div>

    <footer class="foot small muted">
      <p class="quiet">Dibs does the maths; check it against your receipt.</p>
      <p>Dibs is a <a href="../">Challenge Lab</a> app. <a href="https://strongtechnicalconsulting.com/privacy">Privacy</a> · one account works across every app on this site. Friends at your table never need one.</p>
    </footer>
  </main>

  <div class="sticky" id="sticky" hidden></div>
  <div class="sheet-back" id="sheetBack" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog" hidden></div>

  <script src="dibs-core.js"></script>
  <script src="sample.js"></script>
  <script src="qr.js"></script>
  <script src="passkey-client.js"></script>
  <script src="verify-banner.js" data-mount="api/auth" defer></script>
  <script src="app.js"></script>
</body>
</html>
