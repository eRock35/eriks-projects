<body class="dk">
  <a class="skip" href="#main">Skip to your drips</a>
  <header class="top">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">💧</span>Drip</a>
    <nav class="top-links" aria-label="Account">
      <button class="btn small ghost" id="acct" type="button">Sign in</button>
    </nav>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <!-- The example's one-liner, or what your own import read. -->
    <section id="strip" aria-label="About this list"></section>

    <!-- Check a statement: read on this phone, never uploaded. -->
    <section class="importv" id="importView" aria-label="Check your statement" hidden></section>

    <div class="layout" id="mainView">
      <section class="card hero" id="hero" aria-label="The total"></section>
      <section class="card" id="flagsCard" aria-label="Worth a look" hidden></section>
      <section class="card" id="sinceCard" aria-label="Since you last checked" hidden></section>
      <section class="card" id="stackCard" aria-labelledby="stackH" hidden></section>
      <section class="card" id="listCard" aria-label="Every drip"></section>
    </div>

    <footer class="foot small muted">
      <p class="quiet">Drip finds patterns in your charges - check anything before you cancel it.</p>
      <p>Your statement is read on this phone and never uploaded. Drip is a <a href="../">Challenge Lab</a> app. <a href="https://strongtechnicalconsulting.com/privacy">Privacy</a> · one account works across every app on this site.</p>
    </footer>
  </main>

  <div class="sheet-back" id="sheetBack" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog" hidden></div>

  <script src="drip-core.js"></script>
  <script src="sample.js"></script>
  <script src="passkey-client.js"></script>
  <script src="verify-banner.js" data-mount="api/auth" defer></script>
  <script src="app.js"></script>
</body>
</html>
