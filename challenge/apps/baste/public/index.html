<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baste — one oven, nine dishes, dinner at four</title>
  <meta name="description" content="The big dinner worked backward from the time you eat: when every dish starts, goes in, comes out and rests, fitted to your oven, on every phone in the kitchen. Share one link, no sign-in. Free.">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baste">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to the page</a>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="./" data-act="home"><span class="mark" aria-hidden="true"></span>Baste</a>
      <nav class="topnav" id="topnav" aria-label="Baste" hidden>
        <button type="button" data-act="tab" data-tab="today">Today</button>
        <button type="button" data-act="tab" data-tab="plan">Plan</button>
        <button type="button" data-act="tab" data-tab="dishes">Dishes</button>
        <button type="button" data-act="tab" data-tab="helpers">Helpers</button>
      </nav>
      <div class="top-end">
        <a class="lablink" href="../">The Lab</a>
        <button class="btn small ghost" id="acct" type="button" data-act="account">Sign in</button>
      </div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="Baste" hidden>
    <button type="button" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.8 1.8M9.5 3.5h5"/></svg><span>Today</span></button>
    <button type="button" data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h9M4 12h16M4 17.500h12"/><circle cx="17" cy="6.5" r="1.5"/></svg><span>Plan</span></button>
    <button type="button" data-act="tab" data-tab="dishes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.500 14.500h17a8.500 8.500 0 0 0-17 0z"/><path d="M12 6V4.500M3 18h18"/></svg><span>Dishes</span></button>
    <button type="button" data-act="tab" data-tab="helpers"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c.6-3 2.7-4.7 5.5-4.7s4.9 1.7 5.5 4.7"/><circle cx="17" cy="10" r="2.3"/><path d="M16.5 14.6c2.200.2 3.600 1.600 4 4"/></svg><span>Helpers</span></button>
  </nav>

  <main class="wrap" id="main" tabindex="-1"></main>

  <div class="sheet-back" id="sheetBack" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog" hidden></div>
  <div class="vh" id="live" aria-live="polite"></div>

  <script src="baste-core.js"></script>
  <script src="demo.js"></script>
  <script src="baste-store.js"></script>
  <script src="passkey-client.js"></script>
  <script src="verify-banner.js" data-mount="api/auth" defer></script>
  <script src="app.js"></script>

</html>
