<body class="dk">
  <a class="skip" href="#main">Skip to the game</a>
  <header class="top">
    <a class="brand" href="./" id="brand"><span class="mark" aria-hidden="true">🤫</span>Inside Joke</a>
    <nav class="top-links" aria-label="Account">
      <button class="btn small ghost" id="groupsBtn" type="button">My groups</button>
      <button class="btn small ghost" id="acct" type="button">Sign in</button>
    </nav>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <section id="strip" aria-label="About this group"></section>
    <section id="home" hidden></section>
    <section id="view" aria-live="polite"></section>

    <footer class="foot small muted">
      <p>Only members see a group, its photos and its questions. Chats are read on your phone; only the questions are kept.</p>
      <p>Inside Joke is a <a href="../">Challenge Lab</a> app. <a href="https://strongtechnicalconsulting.com/privacy">Privacy</a> · one account works across every app on this site. Members never need one.</p>
    </footer>
  </main>

  <nav class="tabbar dk-tabbar" id="tabs" aria-label="Group" hidden>
    <div class="tabbar-inner">
      <button type="button" data-tab="today"><span class="ic" aria-hidden="true">☀️</span><span>Today</span></button>
      <button type="button" data-tab="live"><span class="ic" aria-hidden="true">🎉</span><span>Live</span></button>
      <button type="button" data-tab="board"><span class="ic" aria-hidden="true">🏆</span><span>Board</span></button>
      <button type="button" data-tab="questions"><span class="ic" aria-hidden="true">✍️</span><span>Questions</span></button>
      <button type="button" data-tab="group"><span class="ic" aria-hidden="true">👪</span><span>Group</span></button>
    </div>
  </nav>

  <div class="sheet-back" id="sheetBack" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog" hidden></div>

  <script src="ij-core.js"></script>
  <script src="sample.js"></script>
  <script src="qr.js"></script>
  <script src="passkey-client.js"></script>
  <script src="verify-banner.js" data-mount="api/auth" defer></script>
  <script src="get-app.js" data-src="ios-app.json" defer></script>
  <script src="app.js"></script>
</body>
</html>
