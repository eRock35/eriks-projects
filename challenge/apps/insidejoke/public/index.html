<body>
  <a class="skip" href="#main">Skip to the game</a>
  <header class="top">
    <a class="brand" href="./" id="brand"><span class="mark" aria-hidden="true">🤫</span><span class="word">Inside Joke</span></a>
    <!-- One nav, two shapes: a floating pill on a phone, part of this bar on a desktop (app.css). -->
    <nav class="tabbar" id="tabs" aria-label="Group" hidden>
      <div class="tabbar-inner">
        <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.75"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/></svg><span>Today</span></button>
        <button type="button" data-tab="live"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8.2 8.2a5.4 5.4 0 000 7.6M15.8 8.2a5.4 5.4 0 010 7.6M5.4 5.4a9.3 9.3 0 000 13.2M18.6 5.4a9.3 9.3 0 010 13.2"/></svg><span>Live</span></button>
        <button type="button" data-tab="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v4.5a4.5 4.5 0 01-9 0z"/><path d="M7.5 6H5a2.5 2.5 0 002.7 3.3M16.5 6H19a2.5 2.5 0 01-2.7 3.3M12 13v4M8.5 20h7"/></svg><span>Board</span></button>
        <button type="button" data-tab="questions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.6L15.6 5a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M13.6 7l3.4 3.4"/></svg><span>Questions</span></button>
        <button type="button" data-tab="group"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0M15.5 5.8a3 3 0 010 5.4M17 14.2a5.5 5.5 0 013.5 4.8"/></svg><span>Group</span></button>
      </div>
    </nav>
    <div class="top-links">
      <button class="btn small ghost" id="groupsBtn" type="button">My groups</button>
      <button class="btn small ghost" id="acct" type="button">Sign in</button>
    </div>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <section id="strip" aria-label="About this group"></section>
    <section id="home" hidden></section>
    <section id="view" aria-live="polite"></section>

    <footer class="foot small muted">
      <p>Only members see a group, its photos and its questions. Chats are read on your phone; only the questions are kept.</p>
      <p>Inside Joke is a <a href="../">Challenge Lab</a> app. <a href="https://strongtechnicalconsulting.com/privacy">Privacy</a> · one account works across every app on this site. Members never need one.</p>
    </footer>
  </main>

  <div class="sheet-back" id="sheetBack" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog" hidden></div>

  <script src="ij-core.js"></script>
  <script src="sample.js"></script>
  <script src="qr.js"></script>
  <script src="passkey-client.js"></script>
  <script src="verify-banner.js" data-mount="api/auth" defer></script>
  <script src="get-app.js" data-src="ios-app.json" defer></script>
  <script src="app.js"></script>
</body>
</html>
