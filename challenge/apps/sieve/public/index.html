  <meta name="description" content="Guardrails on an AI agent are usually a pile of regexes nobody measures: too loose and a card number or an API key leaks, too tight and the agent refuses an order number that looks like a card. Sieve scores your filter rules against a labelled test set - Leak, Break or Correct for every message - suggests fixes with their effect previewed, and attacks your rules with the tricks people use to hide values. Everything runs on your device; nothing is uploaded.">
