<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password · DataViz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D12">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0B0D12; --panel:#141821; --panel-2:#1C212C; --line:rgba(255,255,255,0.09);
    --ink:#EEF1F7; --ink-2:#9AA3B2; --ink-3:#626B7A; --accent:#5B8DEF; --green:#3DD68C; --red:#FF6B6B;
    --sab: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px calc(24px + var(--sab)); }
  .box { width:100%; max-width:400px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:18px; justify-content:center; margin-bottom:22px; }
  .brand svg { width:24px; height:24px; }
  h1 { font-size:24px; letter-spacing:-0.02em; margin:0 0 6px; }
  p.sub { color:var(--ink-2); font-size:15px; margin:0 0 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; }
  label { display:block; font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-3); margin:0 0 6px; }
  input { width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:12px; padding:12px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .btn { width:100%; font:inherit; font-size:16px; font-weight:650; color:#fff; background:var(--accent);
    border:0; border-radius:13px; padding:13px; cursor:pointer; margin-top:14px; }
  .btn:disabled { opacity:0.5; }
  .status { min-height:1.4em; font-size:14px; color:var(--ink-2); margin-top:12px; text-align:center; }
  .status.err { color:var(--red); }
  .status.ok { color:var(--green); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="box">
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="13" width="4" height="8" rx="1.3" fill="#5B8DEF"/>
      <rect x="8" y="8" width="4" height="13" rx="1.3" fill="#B57BFF"/>
      <rect x="14" y="3" width="4" height="18" rx="1.3" fill="#3DD68C"/>
      <circle cx="21" cy="5" r="2" fill="#FFB84D"/>
    </svg>
    DataViz
  </span>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub">At least 10 characters. This link works once.</p>
    <label for="pw">New password</label>
    <input type="password" id="pw" autocomplete="new-password" autofocus>
    <button class="btn" id="go">Set password</button>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var token = new URLSearchParams(location.search).get("t") || "";
  var pw = document.getElementById("pw"), go = document.getElementById("go"), st = document.getElementById("status");
  if (!token) {
    st.className = "status err";
    st.textContent = "That link is missing its token. Ask for a new one from the sign-in sheet.";
    go.disabled = true; pw.disabled = true;
  }
  go.addEventListener("click", async function () {
    if (!pw.value) { st.className = "status err"; st.textContent = "Enter a password."; return; }
    go.disabled = true; st.className = "status"; st.textContent = "Setting it…";
    try {
      var res = await fetch("/api/auth/reset/complete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, password: pw.value })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "That did not work.");
      st.className = "status ok";
      st.textContent = "Done. Signing you in…";
      setTimeout(function () { location.href = "/"; }, 900);
    } catch (e) {
      st.className = "status err"; st.textContent = e.message;
      go.disabled = false;
    }
  });
  pw.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });
})();
</script>
</body>
</html>
