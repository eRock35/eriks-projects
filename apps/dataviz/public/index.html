<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DataViz</title>
<meta name="description" content="Point at data or a link. Claude picks the visual and it moves.">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root {
    --bg: #0B0D12; --panel: #141821; --panel-2: #1C212C; --line: rgba(255,255,255,0.09);
    --ink: #EEF1F7; --ink-2: #9AA3B2; --ink-3: #626B7A;
    --accent: #5B8DEF; --green: #3DD68C; --red: #FF6B6B;
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: calc(var(--sat) + 12px) 16px 12px; background: rgba(11,13,18,0.86);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.02em; font-size: 18px; }
  .brand svg { width: 24px; height: 24px; }
  .spacer { flex: 1; }
  .ghost { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); background: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .ghost:hover { color: var(--ink); border-color: rgba(255,255,255,0.22); }

  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px calc(40px + var(--sab)); }
  h1.hero { font-size: clamp(28px, 7vw, 44px); line-height: 1.08; letter-spacing: -0.03em; margin: 12px 0 8px; font-weight: 800; }
  h1.hero em { font-style: normal; background: linear-gradient(90deg, #5B8DEF, #B57BFF 45%, #3DD68C);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { color: var(--ink-2); font-size: 16px; margin: 0 0 20px; max-width: 46ch; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--panel-2);
    border: 0; border-radius: 11px; padding: 9px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; }
  textarea, input[type=text], input[type=url], input[type=email], input[type=password] {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; resize: vertical; }
  textarea { min-height: 128px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-3); margin: 12px 0 6px; }
  .btn { font: inherit; font-size: 16px; font-weight: 650; color: #fff; background: var(--accent);
    border: 0; border-radius: 13px; padding: 13px 18px; cursor: pointer; width: 100%; margin-top: 12px; }
  .btn:disabled { opacity: 0.5; }
  .btn.sec { background: var(--panel-2); color: var(--ink); }
  .btn.row { width: auto; flex: 1; margin-top: 0; font-size: 14px; padding: 11px 14px; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; }
  .samples { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 4px; }
  .sample {
    text-align: left; font: inherit; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 13px; padding: 11px 12px; cursor: pointer; color: var(--ink);
  }
  .sample:hover { border-color: rgba(255,255,255,0.22); }
  .sample b { display: block; font-size: 14.5px; font-weight: 650; margin-bottom: 3px; }
  .sample span { display: block; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
  .sample i { display: inline-block; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent); margin-top: 7px; }
  .locked { border: 1px dashed var(--line); border-radius: 13px; padding: 13px; margin-top: 12px; color: var(--ink-2); font-size: 14px; }
  .locked b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 15px; }
  .plan { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--green); background: rgba(61,214,140,0.14); border-radius: 6px; padding: 3px 8px; }
  .examples { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .ex { font: inherit; font-size: 13px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .ex:hover { color: var(--ink); }

  .stage { background: #0B0D12; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .stage-head { padding: 14px 16px 8px; }
  .stage-head h2 { font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; margin: 0; font-weight: 700; }
  .stage-head p { color: var(--ink-2); font-size: 13.5px; margin: 5px 0 0; }
  canvas { display: block; width: 100%; height: min(58vh, 460px); }
  .controls { display: flex; align-items: center; gap: 10px; padding: 10px 14px calc(12px + var(--sab));
    border-top: 1px solid var(--line); }
  .play { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 0; background: var(--accent);
    color: #fff; cursor: pointer; display: grid; place-items: center; }
  .play svg { width: 17px; height: 17px; }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.16); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--ink); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%; background: var(--ink); }
  .cap { font: 600 13px ui-monospace, Menlo, monospace; color: var(--ink-2); min-width: 62px; text-align: right; }
  .speed { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--panel-2);
    border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; }

  .note { color: var(--ink-2); font-size: 13.5px; margin: 12px 2px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--panel-2);
    border-radius: 7px; padding: 4px 9px; }

  .status { min-height: 1.4em; font-size: 14px; color: var(--ink-2); margin-top: 10px; text-align: center; }
  .status.err { color: var(--red); }
  .thinking { display: inline-flex; gap: 5px; align-items: center; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bob 1.1s ease-in-out infinite; }
  .thinking i:nth-child(2) { animation-delay: .14s; } .thinking i:nth-child(3) { animation-delay: .28s; }
  @keyframes bob { 0%,60%,100% { transform: translateY(0); opacity: .45 } 30% { transform: translateY(-5px); opacity: 1 } }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; opacity: 0; transition: opacity .28s var(--ease); }
  .backdrop.in { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--panel);
    border-radius: 18px 18px 0 0; max-height: 90dvh; overflow-y: auto; padding: 10px 16px calc(24px + var(--sab));
    transform: translateY(100%); transition: transform .32s var(--ease); }
  .sheet.in { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); margin: 6px auto 14px; }
  .sheet h3 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sheet p.hint { color: var(--ink-2); font-size: 14px; margin: 0 0 14px; }
  .proj { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .proj:last-child { border-bottom: 0; }
  .proj-main { flex: 1; min-width: 0; }
  .proj b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj span { font-size: 12.5px; color: var(--ink-3); }
  .toast { position: fixed; left: 50%; bottom: calc(22px + var(--sab)); transform: translate(-50%, 12px);
    background: rgba(240,244,250,0.96); color: #10131a; font-size: 14px; font-weight: 600; padding: 10px 16px;
    border-radius: 999px; opacity: 0; transition: all .26s var(--ease); z-index: 70; pointer-events: none; }
  .toast.in { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
</style>
  <!-- Analytics. Serves an inert file unless GA_MEASUREMENT_ID is set on
       the service, so local runs and browser tests send nothing. -->
  <script src="/analytics.js" async></script>
<link rel="stylesheet" href="/desktop.css">
</head>
<body class="dk">

<div class="top">
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2" y="13" width="4" height="8" rx="1.3" fill="#5B8DEF"/>
      <rect x="8" y="8" width="4" height="13" rx="1.3" fill="#B57BFF"/>
      <rect x="14" y="3" width="4" height="18" rx="1.3" fill="#3DD68C"/>
      <circle cx="21" cy="5" r="2" fill="#FFB84D"/>
    </svg>
    DataViz
  </span>
  <span class="spacer"></span>
  <button class="ghost" id="libBtn" hidden>Saved</button>
  <button class="ghost" id="authBtn">Sign in</button>
</div>

<div class="wrap">
  <div id="intro">
    <h1 class="hero">Make your data <em>move</em>.</h1>
    <p class="sub">Pick a sample or bring your own. Get a visual that plays &mdash; bars overtaking each other, lines drawing themselves, traffic flowing. The samples are free, no account needed.</p>
  </div>

  <div class="card" id="inputCard">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabSample" aria-selected="true">Sample data</button>
      <button class="tab" role="tab" id="tabLink" aria-selected="false">From a link</button>
      <button class="tab" role="tab" id="tabPaste" aria-selected="false">Paste data</button>
    </div>
    <div id="paneSample">
      <div class="samples" id="samples"></div>
    </div>
    <div id="paneLink" hidden>
      <input type="url" id="urlInput" placeholder="https://en.wikipedia.org/wiki/..." inputmode="url"
             autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Link to a page with data">
      <div class="locked" id="lockedLink" hidden></div>
    </div>
    <div id="panePaste" hidden>
      <textarea id="textInput" placeholder="year,city,visits&#10;2020,Atlanta,120&#10;2021,Atlanta,340&#10;2021,Denver,90" spellcheck="false" aria-label="Paste CSV, JSON or a table"></textarea>
      <div class="locked" id="lockedPaste" hidden></div>
    </div>
    <label class="lbl" for="hintInput">What do you want to see? (optional)</label>
    <input type="text" id="hintInput" placeholder="race the cities over time" aria-label="What to show">
    <button class="btn" id="goBtn">Make it move</button>
    <div class="status" id="status"></div>
  </div>

  <div id="result" hidden>
    <div class="stage">
      <div class="stage-head">
        <h2 id="vizTitle"></h2>
        <p id="vizSub"></p>
      </div>
      <canvas id="stage"></canvas>
      <div class="controls">
        <button class="play" id="playBtn" aria-label="Play or pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub">
        <button class="speed" id="speedBtn">1&times;</button>
        <span class="cap" id="cap"></span>
      </div>
    </div>
    <div class="meta" id="vizMeta"></div>
    <p class="note" id="vizNote"></p>
    <div class="btnrow">
      <button class="btn sec row" id="saveBtn">Save</button>
      <button class="btn sec row" id="shareBtn" hidden>Copy link</button>
      <button class="btn sec row" id="saveVideoBtn">Save video</button>
      <button class="btn sec row" id="againBtn">New one</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/render.js"></script>
<script src="/passkey.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var player = null, current = null, me = { signedIn: false, pro: false, billing: false }, mode = 'sample';

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast in';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'toast'; }, 2400);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  async function api(path, opts) {
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || 'That did not work.');
    return data;
  }
  function say(msg, isError) {
    var s = $('status');
    s.className = 'status' + (isError ? ' err' : '');
    s.innerHTML = msg;
  }

  /* ---------- input ---------- */
  function setMode(next) {
    mode = next;
    ['sample', 'link', 'paste'].forEach(function (m) {
      $('tab' + m.charAt(0).toUpperCase() + m.slice(1)).setAttribute('aria-selected', String(next === m));
      $('pane' + m.charAt(0).toUpperCase() + m.slice(1)).hidden = next !== m;
    });
    $('goBtn').hidden = next === 'sample';
    $('hintInput').parentNode && ($('hintInput').previousElementSibling.hidden = next === 'sample');
    $('hintInput').hidden = next === 'sample';
    renderLocks();
  }
  ['sample', 'link', 'paste'].forEach(function (m) {
    $('tab' + m.charAt(0).toUpperCase() + m.slice(1)).addEventListener('click', function () { setMode(m); });
  });

  // Own data is the paid part. Say so before they type, not after.
  function renderLocks() {
    var locked = me.billing && !me.paid;
    var copy = '<b>Your own data is part of the membership</b>' +
      (me.signedIn ? 'Samples stay free. $5 a month unlocks links and pasting here, and the other four apps with it.'
                   : 'Samples are free without an account. Sign in to use your own data.') +
      '<div class="btnrow"><button class="btn row" id="upBtn">' +
      (me.signedIn ? 'Join \u2014 $5/month' : 'Sign in to join') + '</button></div>';
    ['lockedLink', 'lockedPaste'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.hidden = !locked;
      if (locked) el.innerHTML = copy;
    });
    if (locked) {
      document.querySelectorAll('#upBtn').forEach(function (b) {
        b.addEventListener('click', function () { me.signedIn ? startCheckout() : openAuth('Joining needs an account.'); });
      });
    }
  }

  async function loadSamples() {
    try {
      var d = await api('/api/datasets');
      $('samples').innerHTML = (d.datasets || []).map(function (s2) {
        return '<button type="button" class="sample" data-sample="' + esc(s2.id) + '"' + (s2.free ? ' data-free="1"' : '') + '>' +
          '<b>' + esc(s2.title) + '</b><span>' + esc(s2.blurb) + '</span><i>' + esc(s2.best) + '</i></button>';
      }).join('');
    } catch (e) { $('samples').innerHTML = '<p style="color:var(--ink-2);font-size:14px">Could not load the samples.</p>'; }
  }
  $('samples').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-sample]');
    if (btn) go({ datasetId: btn.getAttribute('data-sample') });
  });

  // The upsell on a locked dataset. Points at the membership - there is one
  // paid tier now, and this used to send people to the retired $9 Pro plan.
  async function startCheckout() {
    try {
      var d = await api('/api/membership/checkout', { method: 'POST' });
      location.href = d.url;
    } catch (err) { toast(err.message); }
  }

  async function go(override) {
    var body = override || { hint: $('hintInput').value.trim() };
    if (override) { /* a sample: nothing else to gather */ }
    else if (mode === 'link') {
      if (!$('urlInput').value.trim()) { say('Paste a link first.', true); return; }
      body.url = $('urlInput').value.trim();
    } else {
      if (!$('textInput').value.trim()) { say('Paste some data first.', true); return; }
      body.text = $('textInput').value;
    }
    $('goBtn').disabled = true;
    say('<span class="thinking"><i></i><i></i><i></i></span> Reading it…');
    try {
      var out = await api('/api/viz', { method: 'POST', body: JSON.stringify(body) });
      show(out);
      say('');
      if (typeof out.remaining === 'number' && out.remaining <= 3) {
        toast(out.remaining + ' more today' + (me.signedIn ? '' : ' — sign in for more'));
      }
    } catch (err) {
      say(esc(err.message), true);
      if (/membership|paid plan|upgrade/i.test(err.message)) {
        me.signedIn ? startCheckout() : openAuth('Joining needs an account.');
      }
    } finally {
      $('goBtn').disabled = false;
    }
  }
  $('goBtn').addEventListener('click', function () { go(); });

  /* ---------- stage ---------- */
  function show(out, readOnly) {
    current = out;
    $('intro').hidden = true;
    $('result').hidden = false;
    if (readOnly) $('inputCard').hidden = true;
    $('vizTitle').textContent = out.title || 'Your data';
    $('vizSub').textContent = out.subtitle || '';
    $('vizNote').textContent = out.note || '';
    $('shareBtn').hidden = true;

    var chips = [];
    chips.push('<span class="chip">' + esc(out.viz.type) + '</span>');
    if (out.rowCount) chips.push('<span class="chip">' + out.rowCount + ' rows</span>');
    if (out.sample) chips.push('<span class="chip">sample: ' + esc(out.sample) + '</span>');
    if (out.fromProse) chips.push('<span class="chip">read from text</span>');
    if (out.sourceUrl) chips.push('<span class="chip">' + esc((out.sourceUrl.split('/')[2] || '')) + '</span>');
    $('vizMeta').innerHTML = chips.join('');

    if (player) player.destroy();
    player = new window.DataViz.Player($('stage'), {
      onTick: function (t, playing, caption) {
        $('scrub').value = String(Math.round(t * 1000));
        $('cap').textContent = caption || '';
        $('playIcon').innerHTML = playing
          ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
          : '<path d="M8 5v14l11-7z"/>';
      }
    });
    player.load(out.viz);
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  $('playBtn').addEventListener('click', function () { if (player) player.toggle(); });
  $('scrub').addEventListener('input', function () {
    if (!player) return;
    player.pause();
    player.seek(Number(this.value) / 1000);
  });
  var SPEEDS = [0.5, 1, 1.5, 2];
  $('speedBtn').addEventListener('click', function () {
    if (!player) return;
    var i = (SPEEDS.indexOf(player.speed) + 1) % SPEEDS.length;
    player.speed = SPEEDS[i];
    this.textContent = SPEEDS[i] + '×';
  });
  /* Record the animation off the canvas it is already drawing to.
   *
   * These visuals exist to be shared and until now could not leave the page -
   * a screenshot of a race chart is the one frame carrying the least
   * information. MediaRecorder over canvas.captureStream needs no server, no
   * library and no upload: the file is made on the viewer's own machine.
   *
   * Format is whatever the browser will actually encode. Chrome and Firefox
   * give WebM; Safari only does MP4, and only from 14.1 - where neither is
   * supported the button says so rather than writing a zero-byte file. */
  var VIDEO_TYPES = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  function pickVideoType() {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return null;
    for (var i = 0; i < VIDEO_TYPES.length; i++) if (MediaRecorder.isTypeSupported(VIDEO_TYPES[i])) return VIDEO_TYPES[i];
    return null;
  }

  function exportVideo(btn) {
    var canvas = $('stage');
    var type = pickVideoType();
    if (!player || !canvas.captureStream || !type) {
      toast('This browser cannot record the canvas. Chrome or Firefox can.', 'error');
      return;
    }
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Recording\u2026';

    var chunks = [];
    var rec = new MediaRecorder(canvas.captureStream(60), { mimeType: type, videoBitsPerSecond: 8000000 });
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = function () { toast('Recording failed.', 'error'); btn.disabled = false; btn.textContent = label; };
    rec.onstop = function () {
      var ext = type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
      var blob = new Blob(chunks, { type: type });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = ((current && current.title) || 'dataviz').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      btn.disabled = false;
      btn.textContent = label;
      toast('Saved ' + (blob.size / 1048576).toFixed(1) + ' MB');
    };

    // From the top, at normal speed, so the file matches what was on screen.
    player.speed = 1;
    player.seek(0);
    player.play();
    rec.start();
    // A little past the end: the last frame should be in the file, and
    // MediaRecorder drops whatever it has not encoded when it stops.
    setTimeout(function () { if (rec.state !== 'inactive') rec.stop(); }, player.duration + 500);
  }

  $('saveVideoBtn').addEventListener('click', function () { exportVideo(this); });

  $('againBtn').addEventListener('click', function () {
    $('result').hidden = true;
    $('intro').hidden = false;
    $('inputCard').hidden = false;
    if (player) { player.destroy(); player = null; }
    history.replaceState(null, '', '/');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- saving ---------- */
  $('saveBtn').addEventListener('click', async function () {
    if (!current) return;
    if (!me.signedIn) { openAuth('Make an account to keep this one.'); return; }
    this.disabled = true;
    try {
      var saved = await api('/api/projects', {
        method: 'POST',
        body: JSON.stringify({
          title: current.title, subtitle: current.subtitle, note: current.note,
          viz: current.viz, sourceUrl: current.sourceUrl
        })
      });
      current.shareId = saved.shareId;
      $('shareBtn').hidden = false;
      toast('Saved');
    } catch (err) { toast(err.message); }
    finally { this.disabled = false; }
  });

  $('shareBtn').addEventListener('click', function () {
    if (!current || !current.shareId) return;
    var url = location.origin + '/v/' + current.shareId;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); },
      function () { prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  });

  /* ---------- sheets ---------- */
  var openEl = null;
  function closeSheet() {
    if (!openEl) return;
    var el = openEl; openEl = null;
    el.classList.remove('in');
    var sh = el.querySelector('.sheet'); if (sh) sh.classList.remove('in');
    document.body.style.overflow = '';
    setTimeout(function () { if (el.parentNode) el.remove(); }, 320);
  }
  function sheet(html) {
    closeSheet();
    var back = document.createElement('div');
    back.className = 'backdrop';
    back.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
    back.addEventListener('click', function (e) { if (e.target === back) closeSheet(); });
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';
    openEl = back;
    requestAnimationFrame(function () { back.classList.add('in'); back.querySelector('.sheet').classList.add('in'); });
    return back;
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function openAuth(reason) {
    var el = sheet(
      '<h3>Save your work</h3>' +
      '<p class="hint">' + esc(reason || 'An account only exists so your visuals are still here tomorrow.') + '</p>' +
      '<label class="lbl" for="aEmail">Email</label>' +
      '<input type="email" id="aEmail" autocomplete="email" autocapitalize="none" spellcheck="false">' +
      '<label class="lbl" for="aPw">Password</label>' +
      '<input type="password" id="aPw" autocomplete="current-password">' +
      '<button class="btn" id="aGo">Sign in</button>' +
      '<button class="btn sec" id="aSwap" style="margin-top:8px">Create an account instead</button>' +
      '<button class="btn sec" id="aFace" style="margin-top:8px" hidden>Sign in with Face ID</button>' +
      '<button class="btn sec" id="aForgot" style="margin-top:8px;background:none;color:var(--ink-2)">Forgot your password?</button>' +
      '<div class="status" id="aStatus"></div>');

    // Only offer Face ID when one exists for this hostname.
    if (window.Passkey && Passkey.supported()) {
      Passkey.status().then(function (st2) {
        if (st2 && st2.registered) el.querySelector('#aFace').hidden = false;
      });
    }
    el.querySelector('#aFace').addEventListener('click', async function () {
      var st2 = el.querySelector('#aStatus');
      this.disabled = true; st2.className = 'status'; st2.textContent = 'Waiting for Face ID\u2026';
      try { await Passkey.signIn(); closeSheet(); await refreshMe(); toast('Signed in'); }
      catch (e2) {
        st2.className = 'status err';
        st2.textContent = Passkey.cancelled(e2) ? '' : (e2.message || 'Face ID did not work.');
        this.disabled = false;
      }
    });
    el.querySelector('#aForgot').addEventListener('click', function () {
      // One reset page for the whole domain - see the note in the landing
      // app's server.js. It is the only service holding the mail key.
      var addr = (el.querySelector('#aEmail') || {}).value || '';
      window.location.href = 'https://www.strongtechnicalconsulting.com/reset' + (addr ? '?email=' + encodeURIComponent(addr.trim()) : '');
    });
    var creating = false;
    el.querySelector('#aSwap').addEventListener('click', function () {
      creating = !creating;
      el.querySelector('#aGo').textContent = creating ? 'Create account' : 'Sign in';
      this.textContent = creating ? 'I already have one' : 'Create an account instead';
      el.querySelector('#aPw').setAttribute('autocomplete', creating ? 'new-password' : 'current-password');
      el.querySelector('#aStatus').textContent = creating ? 'At least 10 characters.' : '';
      el.querySelector('#aStatus').className = 'status';
    });
    el.querySelector('#aGo').addEventListener('click', async function () {
      var st = el.querySelector('#aStatus');
      this.disabled = true;
      st.className = 'status'; st.textContent = 'One moment…';
      try {
        await api(creating ? '/api/auth/register' : '/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: el.querySelector('#aEmail').value, password: el.querySelector('#aPw').value })
        });
        closeSheet();
        await refreshMe();
        toast(creating ? 'Account created' : 'Signed in');
      } catch (err) {
        st.className = 'status err'; st.textContent = err.message;
        this.disabled = false;
      }
    });
  }

  async function openLibrary() {
    var el = sheet('<h3>Saved</h3><p class="hint">Your visuals, kept.</p><div id="libBody">Loading…</div>');
    try {
      var d = await api('/api/projects');
      var body = el.querySelector('#libBody');
      if (!d.projects.length) { body.innerHTML = '<p class="hint">Nothing saved yet. Make one and press Save.</p>'; return; }
      body.innerHTML = d.projects.map(function (p) {
        return '<div class="proj"><span class="proj-main"><b>' + esc(p.title) + '</b>' +
          '<span>' + esc(p.type) + ' · ' + esc(String(p.updatedAt || '').slice(0, 10)) + '</span></span>' +
          '<button class="ghost" data-open="' + esc(p.id) + '">Open</button>' +
          '<button class="ghost" data-del="' + esc(p.id) + '">Delete</button></div>';
      }).join('');
      body.addEventListener('click', async function (e) {
        var open = e.target.closest('[data-open]'), del = e.target.closest('[data-del]');
        if (open) {
          var p = await api('/api/projects/' + encodeURIComponent(open.getAttribute('data-open')));
          closeSheet();
          show({ title: p.title, subtitle: p.subtitle, note: p.note, viz: p.viz, sourceUrl: p.sourceUrl });
          current.shareId = p.shareId;
          $('shareBtn').hidden = false;
        } else if (del) {
          await api('/api/projects/' + encodeURIComponent(del.getAttribute('data-del')), { method: 'DELETE' });
          toast('Deleted');
          closeSheet();
        }
      });
    } catch (err) {
      el.querySelector('#libBody').innerHTML = '<p class="hint">' + esc(err.message) + '</p>';
    }
  }

  $('authBtn').addEventListener('click', function () {
    if (!me.signedIn) return openAuth();
    var el = sheet('<h3>' + esc(me.email) + '</h3>' +
      '<p class="hint">' + (me.paid ? '<span class="plan">Member</span> &nbsp;Your own data is unlocked.'
                                   : 'Free plan &mdash; samples only.') + '</p>' +
      // The membership leads, and since the $9 Pro plan was retired it is the
      // only thing to buy - one price, no decisions to make - so it comes
      // before any mention of keys, credit or tokens. What it sells is the
      // apps; the mechanics underneath are our problem, not the buyer's.
      (me.membership && me.membership.available && !me.paid && !me.membership.active
        ? '<div style="margin-top:14px">' +
          '<p class="hint" style="margin:0 0 8px"><b>$' + me.membership.monthlyUsd + ' a month</b> for all five apps, ' +
          'synced across your devices, with AI built in and tracked so you always know what you have used.</p>' +
          '<button class="btn" id="memberBtn">Get everything &mdash; $' + me.membership.monthlyUsd + '/month</button></div>'
        : '') +
      (me.membership && me.membership.active
        ? '<p class="hint" style="margin-top:14px">Member &mdash; $' + me.membership.monthlyUsd + '/month. ' +
          'Credit below is sold at what a call actually costs, with no markup.</p>'
        : '') +
      (me.paid ? '<button class="btn sec" id="manageBtn">Manage billing</button>' : '') +
      // The credit meter. Shown to anyone on an allowance - the owner and a
      // bring-your-own-key user are not metered, so a balance would be
      // meaningless to them.
      (!me.paid && me.budget && !me.budget.unlimited
        ? '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)">' +
          '<p class="hint" style="margin:0 0 8px"><b>$' + me.budget.remainingUsd.toFixed(2) + '</b> of $' +
          me.budget.allowanceUsd.toFixed(2) + ' credit left &mdash; it works across every app on this domain.</p>' +
          '<div class="btn-row" id="topUps"></div></div>'
        : '') +
      // Bring your own key: folded away, and labelled for who it is for.
      //
      // It is the cheapest path for both sides - they pay Anthropic directly,
      // we carry no balance - but it asks someone to go and create an
      // Anthropic account and paste an API key, and most people neither can
      // nor should. Leading with it would make the normal customer feel the
      // product was not built for them. Closed by default, phrased as a
      // question only someone who already has a key will answer yes to, and
      // never the thing being sold.
      (me.byok && me.byok.supported
        ? '<details style="margin-top:14px;padding-top:14px;border-top:1px solid var(--sep)"' +
          (me.byok.present ? ' open' : '') + '>' +
          '<summary style="cursor:pointer;font-size:13px;opacity:.75">' +
          (me.byok.present ? 'Running on your own Anthropic key' : 'Already have your own Anthropic API key?') +
          '</summary><div style="margin-top:10px">' +
          (me.byok.present
            ? '<p class="hint" style="margin:0 0 8px">Running on <b>your own Anthropic key</b> (…' + esc(me.byok.last4 || '') + '). ' +
              'Anthropic bills you directly; we bill you nothing for usage.</p>' +
              '<button class="btn sec" id="byokRemove">Remove my key</button>'
            : '<p class="hint" style="margin:0 0 8px">If you already have one, you can use it here instead of the ' +
              'credit above and pay Anthropic directly. It is stored encrypted, never shown again, and you can ' +
              'remove it any time. Most people should skip this.</p>' +
              '<input id="byokKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" ' +
              'style="width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--sep);background:transparent;color:inherit">' +
              '<button class="btn sec" id="byokSave" style="margin-top:8px">Save key</button>') +
          '<p class="status" id="byokStatus" style="min-height:1.2em"></p></div></details>'
        : '') +
      // Not everyone who wants this wants to pay for it today - a teacher, a
      // friend, someone trying it for a project. Asking is a second door to
      // the same place, and it reaches Erik by email rather than going into a
      // void. (The id says Pro for the same reason the API field does: the
      // request predates the plan's retirement and renaming the wire would
      // buy nothing.)
      (!me.paid
        ? (me.askedPro
            ? '<p class="hint" style="margin-top:10px">Your request is in \u2014 Erik has been emailed.</p>'
            : '<button class="btn sec" id="askProBtn" style="margin-top:8px">Ask for free access</button>')
        : '') +
      '<div id="secBody" style="margin-top:18px"></div>' +
      '<button class="btn sec" id="outBtn" style="margin-top:8px">Sign out</button>');

    (async function security() {
      var body = el.querySelector('#secBody');
      var supported = window.Passkey && Passkey.supported();
      var keys = supported ? await api('/api/auth/passkeys').catch(function () { return { passkeys: [] }; }) : { passkeys: [] };
      body.innerHTML =
        '<label class="lbl">Face ID</label>' +
        (!supported
          ? '<p class="hint">This browser cannot do passkeys.</p>'
          : ((keys.passkeys || []).length
              ? keys.passkeys.map(function (k) {
                  return '<p class="hint" style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">' +
                    '<span>' + esc(k.label) + ' &middot; ' + esc(k.rpID) + '</span>' +
                    '<button class="ghost" data-pkdel="' + esc(k.id) + '">Remove</button></p>';
                }).join('')
              : '<p class="hint">Not set up on this device yet.</p>') +
            '<input type="password" id="sPw" placeholder="Your password" autocomplete="current-password">' +
            '<button class="btn sec" id="sAdd" style="margin-top:8px">Add Face ID on this device</button>') +
        '<label class="lbl" style="margin-top:18px">Change password</label>' +
        '<input type="password" id="cCur" placeholder="Current password" autocomplete="current-password">' +
        '<input type="password" id="cNew" placeholder="New password" autocomplete="new-password" style="margin-top:8px">' +
        '<button class="btn sec" id="cGo" style="margin-top:8px">Change it</button>' +
        '<div class="status" id="secStatus"></div>';

      body.querySelectorAll('[data-pkdel]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          await api('/api/auth/passkeys/' + encodeURIComponent(btn.getAttribute('data-pkdel')), { method: 'DELETE' });
          toast('Removed'); security();
        });
      });
      var add = body.querySelector('#sAdd');
      if (add) add.addEventListener('click', async function () {
        var st2 = body.querySelector('#secStatus');
        var pwv = body.querySelector('#sPw').value;
        if (!pwv) { st2.className = 'status err'; st2.textContent = 'Enter your password first.'; return; }
        add.disabled = true; st2.className = 'status'; st2.textContent = 'Waiting for Face ID\u2026';
        try { await Passkey.enrol({ password: pwv }); toast('Face ID is on'); security(); }
        catch (e2) {
          st2.className = 'status err';
          st2.textContent = Passkey.cancelled(e2) ? 'Cancelled.' : (e2.message || 'That did not work.');
          add.disabled = false;
        }
      });
      body.querySelector('#cGo').addEventListener('click', async function () {
        var st2 = body.querySelector('#secStatus');
        this.disabled = true; st2.className = 'status'; st2.textContent = 'Saving\u2026';
        try {
          await api('/api/auth/password', { method: 'POST', body: JSON.stringify({
            current: body.querySelector('#cCur').value, next: body.querySelector('#cNew').value }) });
          st2.className = 'status'; st2.textContent = 'Changed.'; toast('Password changed');
        } catch (e2) { st2.className = 'status err'; st2.textContent = e2.message; }
        this.disabled = false;
      });
    })();
    var mem = el.querySelector('#memberBtn');
    if (mem) mem.addEventListener('click', async function () {
      mem.disabled = true;
      try {
        var out = await api('/api/membership/checkout', { method: 'POST' });
        location.href = out.url;
      } catch (err) {
        toast(err.message || 'Could not start that.');
        mem.disabled = false;
      }
    });
    var ups = el.querySelector('#topUps');
    if (ups) {
      fetch('/api/credit').then(function (r) { return r.json(); }).then(function (d) {
        if (!d.billing) { ups.innerHTML = '<p class="hint">Top-ups are not available on this deployment.</p>'; return; }
        ups.innerHTML = d.options.map(function (o) {
          return '<button class="btn sec" data-usd="' + o.usd + '">' + esc(o.label) + '</button>';
        }).join('');
        ups.querySelectorAll('[data-usd]').forEach(function (b) {
          b.addEventListener('click', async function () {
            b.disabled = true;
            try {
              var out = await api('/api/credit/checkout', { method: 'POST', body: JSON.stringify({ usd: Number(b.getAttribute('data-usd')) }) });
              window.location.href = out.url;
            } catch (e) { toast(e.message, 'error'); b.disabled = false; }
          });
        });
      }).catch(function () { ups.textContent = ''; });
    }

    var byokSave = el.querySelector('#byokSave');
    if (byokSave) byokSave.addEventListener('click', async function () {
      var st = el.querySelector('#byokStatus');
      var field = el.querySelector('#byokKey');
      byokSave.disabled = true; st.className = 'status'; st.textContent = 'Checking the key\u2026';
      try {
        // The server proves the key works against Anthropic before storing it,
        // so this either succeeds or says exactly what is wrong with it.
        await api('/api/auth/byok', { method: 'POST', body: JSON.stringify({ key: field.value.trim() }) });
        field.value = '';
        await refreshMe();
        closeSheet();
        toast('Now running on your own key');
      } catch (e) {
        st.className = 'status err'; st.textContent = e.message; byokSave.disabled = false;
      }
    });

    var byokRemove = el.querySelector('#byokRemove');
    if (byokRemove) byokRemove.addEventListener('click', async function () {
      var st = el.querySelector('#byokStatus');
      byokRemove.disabled = true; st.className = 'status'; st.textContent = 'Removing\u2026';
      try {
        await api('/api/auth/byok', { method: 'DELETE' });
        await refreshMe();
        closeSheet();
        toast('Key removed - back on the shared credit');
      } catch (e) {
        st.className = 'status err'; st.textContent = e.message; byokRemove.disabled = false;
      }
    });

    var askPro = el.querySelector('#askProBtn');
    if (askPro) askPro.addEventListener('click', async function () {
      var note = window.prompt('Anything you want to tell Erik? (optional)') || '';
      askPro.disabled = true;
      try {
        await api('/api/auth/access/request', { method: 'POST', body: JSON.stringify({ note: note }) });
        askPro.outerHTML = '<p class="hint" style="margin-top:10px">Your request is in \u2014 Erik has been emailed.</p>';
        toast('Request sent');
      } catch (e) { toast(e.message, 'error'); askPro.disabled = false; }
    });
    var man = el.querySelector('#manageBtn');
    if (man) man.addEventListener('click', async function () {
      try { var d = await api('/api/billing-portal', { method: 'POST' }); location.href = d.url; }
      catch (err) { toast(err.message); }
    });
    el.querySelector('#outBtn').addEventListener('click', async function () {
      await api('/api/auth/logout', { method: 'POST' });
      closeSheet(); await refreshMe(); toast('Signed out');
    });
  });
  $('libBtn').addEventListener('click', openLibrary);

  async function refreshMe() {
    try { me = await api('/api/auth/me'); } catch (e) { me = { signedIn: false }; }
    $('authBtn').textContent = me.signedIn ? 'Account' : 'Sign in';
    $('libBtn').hidden = !me.signedIn;
    renderLocks();
  }

  /* ---------- shared view ---------- */
  async function boot() {
    await refreshMe();
    await loadSamples();
    setMode('sample');
    // ?member=1 is what the membership checkout returns to; ?upgraded=1 was
    // the retired Pro plan's and is kept so an old bookmark still lands right.
    if (/[?&](member|upgraded)=1/.test(location.search)) {
      // The webhook may land a moment after the redirect, so re-read once.
      setTimeout(async function () { await refreshMe(); toast(me.paid ? 'You are a member' : 'Payment received, unlocking…'); }, 1500);
      history.replaceState(null, '', '/');
    }
    // Every other app's "you are out of credit" points here, because checkout
    // is built once and the balance it buys is shared. Land them on the panel
    // that sells it rather than on the home page to hunt for it.
    if (/[?&](topup|key)=1/.test(location.search)) {
      history.replaceState(null, '', '/');
      if (me.signedIn) $('authBtn').click();
      else { openAuth(); toast('Sign in first, then top up'); }
    }
    var m = location.pathname.match(/^\/v\/([A-Za-z0-9_-]+)$/);
    if (m) {
      try {
        var p = await api('/api/shared/' + encodeURIComponent(m[1]));
        show({ title: p.title, subtitle: p.subtitle, note: p.note, viz: p.viz, sourceUrl: p.sourceUrl }, true);
        $('againBtn').textContent = 'Make your own';
        $('saveBtn').hidden = true;
      } catch (err) {
        say(esc(err.message), true);
      }
    }
  }
  boot();
})();
</script>
<script src="/tour.js"></script>
<script>
// The self-running demo the landing page frames: tap a free sample, watch it
// play, tap "New one", tap the next. ONLY samples marked free - those render
// from a baked spec with no model call, so this never spends anything.
//
// It does not scroll on its own. Tapping a sample swaps the intro for the
// result at the top of the page, which is what the app does for anyone; an
// extra scroll on top of that read as the page jumping about. "New one" is
// the app's own way back, and it scrolls up smoothly itself.
(function () {
  "use strict";
  if (!window.Tour || !Tour.active()) return;
  var T = window.Tour;
  var i = 0;
  function inView(el) { var r = el.getBoundingClientRect(); return r.top >= 0 && r.bottom <= window.innerHeight; }
  T.run([
    async function pickOne() {
      var free = await T.until(function () {
        var f = document.querySelectorAll('#samples [data-free="1"]');
        return f.length && !document.getElementById('intro').hidden ? f : null;
      }, 20000);
      var btn = free[i++ % free.length];
      if (!inView(btn)) await T.scrollTo(window, Math.max(0, btn.getBoundingClientRect().top + window.scrollY - 120), 650);
      await T.wait(400);
      await T.tap(btn);
    },
    async function watchIt() {
      await T.until(function () { var st = document.getElementById('stage'); return st && st.getBoundingClientRect().height > 0; }, 15000);
      await T.wait(9500);
    },
    async function newOne() {
      var again = document.getElementById('againBtn');
      if (!inView(again)) await T.scrollTo(window, Math.max(0, again.getBoundingClientRect().top + window.scrollY - 300), 600);
      await T.tap(again);
      await T.wait(900);
    },
  ], { pause: 200 });
})();
</script>
