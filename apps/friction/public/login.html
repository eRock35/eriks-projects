<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friction</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --tint: #007AFF; --bg: #F2F2F7; --card: #FFFFFF; --label: #1C1C1E;
    --label-2: #6E6E73; --label-3: #A1A1A6; --sep: rgba(60,60,67,0.16); --red: #FF3B30;
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1C1C1E; --label: #F5F5F7; --label-2: #98989D;
            --label-3: #6E6E73; --sep: rgba(84,84,88,0.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--label);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--sat) + 24px) 20px calc(var(--sab) + 24px);
  }
  .box { width: 100%; max-width: 380px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: block; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
  p.sub { color: var(--label-2); font-size: 15px; margin: 0 0 26px; }
  form { background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  input {
    font: inherit; font-size: 16px; padding: 13px 14px; border-radius: 11px;
    border: 1px solid var(--sep); background: var(--bg); color: var(--label); width: 100%;
  }
  input:focus { outline: 2px solid var(--tint); outline-offset: -1px; }
  button {
    font: inherit; font-weight: 600; font-size: 16px; padding: 13px; border: 0;
    border-radius: 11px; background: var(--tint); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .err { color: var(--red); font-size: 14px; min-height: 1.3em; margin: 12px 0 0; }
  .faceid { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
    font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: var(--tint);
    border: 0; border-radius: 11px; padding: 13px; cursor: pointer; margin-bottom: 12px; }
  .faceid:disabled { opacity: 0.55; }
  .faceid svg { width: 21px; height: 21px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--label-3); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--sep); }
  .linkish { width: 100%; background: none; border: 0; font: inherit; font-size: 15px;
    color: var(--tint); padding: 10px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
  <!-- Analytics. Serves an inert file unless GA_MEASUREMENT_ID is set on
       the service, so local runs and browser tests send nothing. -->
  <script src="/analytics.js" async></script>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect width="64" height="64" rx="15" fill="#007AFF"/>
    <path d="M20 40c6-3 8-9 12-13s8-5 12-3" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="26" r="4" fill="#fff"/>
  </svg>
  <h1>Friction</h1>
  <p class="sub">Problems worth building around.</p>
  <button type="button" class="faceid" id="faceBtn" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
      <path d="M9 10v1.5M15 10v1.5M12 10v3l-1 .8M9.5 16c1.6 1 3.4 1 5 0"/>
    </svg>
    Sign in with Face ID
  </button>
  <div class="or" id="or" hidden>or</div>
  <button type="button" class="linkish" id="showPw" hidden>Use a password instead</button>

  <!-- The shared account. One email and password for every app on this
       domain, and the form people should reach for - the app password below
       is the original single-key door, kept so a fault in the identity
       service cannot lock Erik out of his own tool. -->
  <form id="idForm">
    <input type="email" id="idEmail" placeholder="Email" autocomplete="username" inputmode="email"
           autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Email" required>
    <input type="password" id="idPw" placeholder="Password" autocomplete="current-password"
           enterkeyhint="go" aria-label="Password" required>
    <button type="submit" id="idGo">Sign in</button>
  </form>

  <button type="button" class="linkish" id="showApp">Use the app password</button>
  <form id="f" hidden>
    <input type="password" id="pw" placeholder="App password" autocomplete="current-password"
           enterkeyhint="go" aria-label="App password" required>
    <button type="submit" id="go">Sign in</button>
  </form>
  <p class="err" id="err"></p>
</div>
<script src="/passkey.js"></script>
<script>
  var f = document.getElementById("f"), pw = document.getElementById("pw");
  var idForm = document.getElementById("idForm"), idEmail = document.getElementById("idEmail");
  var idPw = document.getElementById("idPw"), idGo = document.getElementById("idGo");
  var faceBtn = document.getElementById("faceBtn"), orEl = document.getElementById("or");
  var showPw = document.getElementById("showPw"), showApp = document.getElementById("showApp");

  // TWO passkey stores live behind this one button.
  //
  // /api/id/passkey belongs to the shared account - the passkey someone
  // enrolled once and expects to work on all five apps. /api/auth/passkey is
  // this app's own, from when Friction had a single password and no accounts.
  // The shared one wins when it has a credential for this hostname, because
  // that is the one people think they registered; the local one stays as the
  // fallback that cannot be broken by the identity service.
  var SHARED = "/api/id/passkey", LOCAL = "/api/auth/passkey";
  var passkeyBase = LOCAL;

  if (window.Passkey && Passkey.supported()) {
    Promise.all([Passkey.status(SHARED), Passkey.status(LOCAL)]).then(function (states) {
      var shared = states[0] && states[0].registered;
      var local = states[1] && states[1].registered;
      if (!shared && !local) return;   // a button that can only fail is worse than none
      passkeyBase = shared ? SHARED : LOCAL;
      faceBtn.hidden = false; orEl.hidden = false; showPw.hidden = false;
      idForm.hidden = true; showApp.hidden = true;
      faceBtn.focus();
    });
  }
  showPw.addEventListener("click", function () {
    idForm.hidden = false; showApp.hidden = false; showPw.hidden = true; idEmail.focus();
  });
  showApp.addEventListener("click", function () {
    f.hidden = false; showApp.hidden = true; pw.focus();
  });
  faceBtn.addEventListener("click", async function () {
    faceBtn.disabled = true; err.textContent = "";
    try { await Passkey.signIn(passkeyBase); location.href = "/"; }
    catch (e) {
      err.textContent = Passkey.cancelled(e) ? "" : (e.message || "Face ID did not work.");
      faceBtn.disabled = false; idForm.hidden = false; showApp.hidden = false; showPw.hidden = true;
    }
  });

  idForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = ""; idGo.disabled = true; idGo.textContent = "Signing in…";
    try {
      var res = await fetch("/api/id/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: idEmail.value, password: idPw.value })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Sign-in failed.");
      location.href = "/";
    } catch (e2) {
      err.textContent = e2.message;
      idGo.disabled = false; idGo.textContent = "Sign in";
      idPw.select();
    }
  });
  var go = document.getElementById("go"), err = document.getElementById("err");
  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Signing in…";
    try {
      var res = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw.value })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Sign-in failed.");
      location.href = "/";
    } catch (e2) {
      err.textContent = e2.message;
      go.disabled = false; go.textContent = "Sign in";
      pw.select();
    }
  });
  if (!idForm.hidden) idEmail.focus();
</script>
</body>
</html>
